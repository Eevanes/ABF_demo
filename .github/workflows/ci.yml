name: Arena checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.18
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run python evals/run.py
