[project]
name = "arena-demo"
version = "0.2.0"
description = "ANC 比赛运行层：本地可演练的 MCP demo"
requires-python = ">=3.12"
dependencies = [
  "mcp==1.30.0", "starlette>=0.40,<1", "uvicorn>=0.30,<1",
  "httpx>=0.28,<1", "pydantic-settings>=2.7,<3", "typer>=0.15,<1",
  "rapidfuzz>=3,<4", "jieba>=0.42,<1", "rank-bm25>=0.2,<1",
  "wecom-aibot-python-sdk==1.0.2", "PyYAML>=6,<7",
  "qrcode>=8,<9",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "respx>=0.22,<1", "ruff>=0.12,<1", "mypy>=1.15,<2", "types-PyYAML>=6,<7"]

[project.scripts]
arena = "arena.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arena"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
